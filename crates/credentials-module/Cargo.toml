[package]
name = "credentials-module"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"
description = "The claustrum subc module: registers a reserved ManagementSurface, serves the anonymous read surface (credential.get/status/report_auth_failure) over the subc wire, and runs the master-key-gated admin surface (put/import/invalidate/rotate_master_key) off the runtime channel."

# The supervised daemon exe. Named with the fleet-wide `ck-*` prefix (Activity
# Monitor grouping). The package name stays `credentials-module` while the
# module_id is `claustrum` — and the module_id is the load-bearing one: it derives
# the data directory, the keychain service, the single-writer lease key, and the
# admin-transcript vault id. The executable's filename derives nothing.
[[bin]]
name = "ck-claustrum"
path = "src/main.rs"

# The admin CLI — the `ck auth` dispatcher target (`ck <domain>` execs `ck-<domain>`).
# Writes commit through the RUNNING module automatically (auto-discovered subc
# connection file), or through the offline single-writer lease when the daemon is
# stopped. Distinct from the daemon exe name `ck-claustrum`: the operator surface is
# `ck auth`, and the `ck` dispatcher resolves it by that name, so the CLI keeps it
# while the daemon follows the module id.
[[bin]]
name = "ck-auth"
path = "src/bin/credentials_cli.rs"

[features]
# Compiles an integration-only failure seam into `ck-auth` after its OpenCode
# tombstone write but before the durability reread. OFF by default: release builds
# contain no environment-triggered migration interruption path.
opencode-test-seam = []

[dependencies]
ring = { workspace = true }
base64 = { workspace = true }
credentials-core = { path = "../credentials-core" }
subc-protocol = { workspace = true }
subc-transport = { workspace = true }
cortexkit-store = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
# For the APNs hand-send example, which performs the submission itself. The daemon
# does not submit notifications; the core crate owns the request shape and this
# crate only needs a client to hand it.
reqwest = { workspace = true }
async-trait = { workspace = true }
# The CLI's `login` command stamps the minted token's expiry from wall-clock time.
chrono = { workspace = true }
# Interactive login UX: the provider picker (arrow keys + fuzzy filter) and the
# add-vs-replace account prompt. CLI-only; the daemon never prompts.
dialoguer = { version = "0.12", features = ["fuzzy-select"] }

[dev-dependencies]
subc-core = { workspace = true }
# Read the audit_log directly (after stopping the daemon to release the lease) so
# the on-the-wire malicious-client conformance test can assert the durable alarm
# rows its adversarial traffic raised actually landed.
rusqlite = { workspace = true }
